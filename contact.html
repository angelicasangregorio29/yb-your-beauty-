<main class="main-content">
    <header class="page-header slide-in-up">
        <h2>Get In Touch With Yb</h2>
        <p>Our team of dedicated Skincare Experts is ready to help you with any questions.</p>
    </header>

    <section>
        
        <form class="contact-form">
            <div style="margin-bottom: 20px;">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div style="margin-bottom: 20px;">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div style="margin-bottom: 20px;">
                <label for="subject">Subject:</label>
                <select id="subject" name="subject" required>
                    <option value="">Please select...</option>
                    <option>Product Question</option>
                    <option>Order Inquiry</option>
                    <option>Skincare Advice</option>
                    <option>Feedback & Suggestions</option>
                    <option>Wholesale Inquiry</option>
                    <option>Other</option>
                </select>
            </div>
            <div style="margin-bottom: 20px;">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="6" required></textarea>
            </div>
            
            <button type="submit" class="cta-button">Send Message</button>
        </form>

        <div class="contact-info">
            <p class="slide-in-up"><strong>Customer Service:</strong> <a href="mailto:support@yourbeauty.com" style="color: var(--text-light); text-decoration: none;">support@yourbeauty.com</a></p>
            <p class="slide-in-up"><strong>Phone:</strong> +1 (555) YB-SKIN</p>
            <p class="slide-in-up"><strong>Office Hours:</strong> Mon-Fri, 9:00 AM - 5:00 PM EST</p>
        </div>
    </section>
</main>
